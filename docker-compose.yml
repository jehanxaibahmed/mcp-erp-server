services:
  postgres:
    image: postgres:17-alpine
    container_name: erp-mcp-postgres
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_password
    ports:
      - "5433:5432"
    volumes:
      - erp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The MCP server itself. It speaks stdio, so it isn't a long-running service: use it for
  # one-off commands, e.g.
  #   docker compose run --rm erp-mcp migrate --seed
  #   docker compose run --rm erp-mcp orders pending
  erp-mcp:
    build: .
    image: erp-mcp:local
    profiles: ["tools"]
    stdin_open: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp_dev_password"

  # Remote MCP over Streamable HTTP with OAuth bearer auth, using a DEVELOPMENT signing key.
  #   docker compose --profile http up -d erp-mcp-http   →  http://localhost:5100/mcp
  # For anything beyond local testing, replace Auth__DevSigningKey with Auth__Authority.
  erp-mcp-http:
    build: .
    image: erp-mcp:local
    profiles: ["http"]
    command: ["http"]
    ports:
      - "5100:5100"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=erp;Username=erp;Password=erp_dev_password"
      Http__Url: "http://0.0.0.0:5100"
      Http__PublicUrl: "http://localhost:5100"
      Security__Scopes: "read orders:draft"
      Auth__Audience: "erp-mcp"
      Auth__DevSigningKey: "local-dev-signing-key-change-me-0123456789"

volumes:
  erp-pgdata:
